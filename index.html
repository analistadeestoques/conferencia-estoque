<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0072B2">
<title>Conferência de Estoque</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f2f4f7;--card:#fff;--tx:#17202b;--mut:#5d6877;--bd:#d6dce4;--ac:#0072B2;--falta:#D55E00;--ok:#009E73;--sobra:#B8860B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff;padding:10px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:1000px;margin:0 auto 8px}
.row:last-child{margin-bottom:0}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;min-height:46px}
button{cursor:pointer;font-weight:600}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.x{color:var(--falta)}
header label{display:flex;gap:6px;align-items:center;font-size:14px}
header label input[type=checkbox]{min-height:0;width:22px;height:22px}
header select{flex:1;min-width:150px}
#q{flex:2;min-width:180px}
#stat{font-weight:600;font-size:14px}
#aviso{display:none;background:var(--falta);color:#fff;padding:8px 12px;font-weight:600}
main{max-width:1000px;margin:0 auto;padding:10px 12px 40px}
h2{font-size:14px;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
.it{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) 90px 90px 100px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.it.ok{border-left-color:var(--ok)}.it.falta{border-left-color:var(--falta)}.it.sobra{border-left-color:var(--sobra)}.it.sem_saldo{border-left-color:var(--ac)}
.nm{font-weight:600;overflow-wrap:anywhere}.nm small{display:block;font-weight:400;color:var(--mut)}
.nm .del{display:block;margin-top:6px;min-height:34px;padding:2px 10px;font-size:13px;font-weight:500}
.ent{display:flex;gap:6px}.ent input{flex:1;min-width:0;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chips button{min-height:34px;padding:2px 12px;border-radius:99px;font-weight:500}
.num{text-align:right;font-size:20px;font-weight:700;overflow-wrap:anywhere}
.num small{display:block;font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase}
.falta .dif{color:var(--falta)}.sobra .dif{color:var(--sobra)}.ok .dif{color:var(--ok)}
.obs{grid-column:1/-1;min-height:38px;padding:6px 10px;font-size:14px}
.cego .saldo,.cego .dif{visibility:hidden}
.vazio{background:var(--card);border:1px dashed var(--bd);border-radius:12px;padding:24px;text-align:center}
dialog{width:min(680px,94vw);max-height:90vh;border:0;border-radius:16px;padding:16px;background:var(--card);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{margin:0 0 8px}
dialog p{color:var(--mut);font-size:14px;margin:6px 0}
dialog textarea{width:100%;height:36vh;font:14px ui-monospace,monospace}
dialog .row{margin:8px 0 0}
#dres{white-space:pre-wrap;font-size:14px}
@media (max-height:900px){header{position:static}}
@media (max-width:720px){.it{grid-template-columns:repeat(3,minmax(0,1fr))}.nm,.cont{grid-column:1/-1}}
</style>
</head>
<body>
<div id="aviso"></div>
<header>
  <div class="row">
    <select id="emp" aria-label="Empresa"></select>
    <select id="set" aria-label="Setor"></select>
    <button id="bMenu">⚙ Opções</button>
  </div>
  <div class="row">
    <label>Data <input type="date" id="data"></label>
    <input id="resp" placeholder="Responsável" autocomplete="off">
    <label><input type="checkbox" id="cego"> Contagem cega</label>
  </div>
  <div class="row">
    <input id="q" type="search" placeholder="Buscar item ou código…">
    <select id="cat" aria-label="Categoria"></select>
    <select id="filtro" aria-label="Situação">
      <option value="">Todos</option><option value="nao_contado">Não contados</option><option value="div">Divergências</option>
    </select>
  </div>
  <div class="row">
    <button id="bItens">Cadastrar itens</button>
    <button id="bSaldo">Saldo do sistema</button>
    <button id="bRel">Relatório</button>
    <span id="stat"></span>
  </div>
</header>
<main id="lista"></main>

<dialog id="dImp">
  <h3 id="impT"></h3>
  <p id="impA"></p>
  <input type="file" id="impF" accept=".csv,.txt,.tsv">
  <textarea id="impX" spellcheck="false"></textarea>
  <label id="impRl"><input type="checkbox" id="impR"> Remover do setor os itens que não estão nesta lista</label>
  <div id="dres"></div>
  <div class="row"><button class="p" id="impOk">Importar</button><button data-fechar>Fechar</button></div>
</dialog>

<dialog id="dRel">
  <h3>Relatório</h3>
  <label><input type="checkbox" id="relD" checked> Listar só divergências</label>
  <textarea id="relX" readonly></textarea>
  <div class="row"><button class="p" id="relC">Copiar</button><button id="relS">Compartilhar</button><button id="relV">Baixar CSV</button><button data-fechar>Fechar</button></div>
</dialog>

<dialog id="dMenu">
  <h3>Opções</h3>
  <p>Empresa e setor selecionados</p>
  <div class="row"><button id="mNovoSetor">Novo setor</button><button id="mRenSetor">Renomear setor</button><button class="x" id="mDelSetor">Excluir setor</button></div>
  <div class="row"><button id="mNovaEmp">Nova empresa</button><button id="mRenEmp">Renomear empresa</button><button class="x" id="mDelEmp">Excluir empresa</button></div>
  <p>Zera contagens, saldo e observações deste setor. A lista de itens fica.</p>
  <div class="row"><button class="x" id="mNova">Nova conferência</button></div>
  <p>Apaga a lista de itens do setor selecionado.</p>
  <div class="row"><button class="x" id="mLimpar">Excluir todos os itens do setor</button></div>
  <p>Backup de todas as empresas. Guarde o arquivo fora do tablet de vez em quando.</p>
  <div class="row"><button class="p" id="mBk">Baixar backup</button><button id="mRs">Restaurar backup</button><input type="file" id="mFile" accept=".json" hidden></div>
  <div class="row"><button data-fechar>Fechar</button></div>
</dialog>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
